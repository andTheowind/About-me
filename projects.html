<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("site-theme");
          document.documentElement.setAttribute(
            "data-theme",
            savedTheme || "dark",
          );
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta
      name="description"
      content="Примеры работ веб-разработчика andTheowind: лендинги и сайты."
    />
    <title>Проекты — andTheowind</title>
    <link rel="stylesheet" href="css/tailwindmin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
    />
  </head>

  <body
    class="flex justify-center items-center projects-buttons-v1 projects-page"
  >
    <!-- Button styles: projects-buttons-v1 | projects-buttons-v2 | projects-buttons-v3 -->
    <div class="mask flex justify-center items-center">
      <div class="loader" role="status" aria-label="Загрузка"></div>
    </div>
    <!-- /.mask -->
    <button
      type="button"
      class="theme-toggle"
      data-theme-toggle
      aria-label="Переключить тему"
    >
      <span class="theme-toggle__icon" aria-hidden="true">
        <i class="fas fa-sun" aria-hidden="true"></i>
      </span>
      <span class="theme-toggle__text">Светлая тема</span>
    </button>

    <div class="wrapper page-projects flex flex-col justify-center">
      <div class="projects-scene" aria-hidden="true">
        <canvas class="projects-bg-canvas"></canvas>
      </div>
      <header>
        <div class="container">
          <div class="circle-container">
            <div class="circle">
              <button
                type="button"
                class="border-none"
                id="closeBtn"
                aria-label="Закрыть меню"
              >
                <i class="fas fa-times" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="border-none"
                id="openBtn"
                aria-label="Открыть меню"
              >
                <i class="fas fa-bars" aria-hidden="true"></i>
              </button>
            </div>
            <!-- /.circle -->
          </div>
          <!-- /.circle-container -->
        </div>
      </header>
      <!-- /.header -->
      <main>
        <section
          class="projects-section container mx-auto px-4 sm:px-6 md:px-8 lg:px-12"
          aria-labelledby="projects-title"
        >
          <header class="title text-center mt-14 mb-12 md:mt-16 md:mb-16">
            <h1
              id="projects-title"
              class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl"
            >
              Примеры <span>работ</span>
            </h1>
            <p class="subtitle">
              Коммерческие и учебные проекты — от лендингов до витрин.
            </p>
          </header>
          <!-- /.title -->

          <div
            class="relative z-10 mb-8 md:mb-10 rounded-2xl border p-4 sm:p-5"
            style="
              background: var(--surface);
              border-color: var(--border);
              box-shadow: var(--shadow-soft);
              backdrop-filter: blur(14px);
            "
          >
            <div class="flex flex-col gap-3 md:flex-row">
              <label
                class="flex h-11 flex-1 items-center gap-3 rounded-xl border px-4"
                for="projects-search"
                style="background: var(--bg-elevated); border-color: var(--border)"
              >
                <i
                  class="fas fa-search flex-shrink-0 text-sm"
                  style="color: var(--text-muted)"
                  aria-hidden="true"
                ></i>
                <input
                  id="projects-search"
                  type="search"
                  class="h-full w-full border-0 bg-transparent p-0 text-sm outline-none"
                  style="color: var(--text)"
                  placeholder="Поиск по названию..."
                  autocomplete="off"
                  data-projects-search
                />
              </label>

              <button
                type="button"
                class="flex h-11 w-full items-center justify-center gap-3 rounded-xl border px-4 text-sm font-medium md:w-auto"
                style="
                  background: var(--bg-elevated);
                  border-color: var(--border);
                  color: var(--text);
                "
                aria-expanded="false"
                aria-controls="projects-filters-panel"
                data-projects-filters-toggle
              >
                <i
                  class="fas fa-sliders-h text-xs"
                  style="color: var(--text-muted)"
                  aria-hidden="true"
                ></i>
                <span data-projects-filters-label>Фильтры</span>
              </button>
            </div>

            <div
              id="projects-filters-panel"
              class="overflow-hidden opacity-0 transition-all duration-300"
              style="max-height: 0"
              data-projects-filters-panel
              hidden
            >
              <div
                class="mt-4 border-t pt-4"
                style="border-color: var(--border)"
              >
                <p
                  class="mt-0 mb-3 text-sm font-medium"
                  style="color: var(--text-muted)"
                >
                  Теги
                </p>
                <div
                  class="flex flex-wrap gap-3"
                  data-projects-tags
                  role="group"
                  aria-label="Фильтр по тегам"
                ></div>

                <div class="mt-5 grid gap-3 md:grid-cols-2 md:items-end">
                  <div
                    class="relative"
                    data-projects-sort
                  >
                    <p
                      class="mt-0 mb-3 text-sm font-medium"
                      style="color: var(--text-muted)"
                    >
                      Сортировка
                    </p>
                    <button
                      type="button"
                      class="flex h-11 w-full items-center justify-between gap-3 rounded-xl border px-4 text-left text-sm font-medium md:max-w-xs"
                      style="
                        background: var(--bg-elevated);
                        border-color: var(--border);
                        color: var(--text);
                      "
                      aria-haspopup="listbox"
                      aria-expanded="false"
                      data-projects-sort-button
                    >
                      <span data-projects-sort-label>Сначала новые</span>
                      <i
                        class="fas fa-chevron-down text-xs"
                        style="color: var(--text-muted)"
                        aria-hidden="true"
                      ></i>
                    </button>

                    <div
                      class="mt-2 hidden w-full max-w-xs overflow-hidden rounded-xl border p-1"
                      style="
                        background: var(--surface);
                        border-color: var(--border);
                        box-shadow: var(--shadow-soft);
                      "
                      role="listbox"
                      data-projects-sort-menu
                    >
                      <button
                        type="button"
                        class="flex h-11 w-full items-center rounded-xl px-3 text-left text-sm"
                        data-sort-value="year-desc"
                        role="option"
                      >
                        Сначала новые
                      </button>
                      <button
                        type="button"
                        class="flex h-11 w-full items-center rounded-xl px-3 text-left text-sm"
                        data-sort-value="year-asc"
                        role="option"
                      >
                        Сначала старые
                      </button>
                      <button
                        type="button"
                        class="flex h-11 w-full items-center rounded-xl px-3 text-left text-sm"
                        data-sort-value="title-asc"
                        role="option"
                      >
                        По названию (А–Я)
                      </button>
                      <button
                        type="button"
                        class="flex h-11 w-full items-center rounded-xl px-3 text-left text-sm"
                        data-sort-value="title-desc"
                        role="option"
                      >
                        По названию (Я–А)
                      </button>
                      <button
                        type="button"
                        class="flex h-11 w-full items-center rounded-xl px-3 text-left text-sm"
                        data-sort-value="popularity-desc"
                        role="option"
                      >
                        По популярности
                      </button>
                      <button
                        type="button"
                        class="flex h-11 w-full items-center rounded-xl px-3 text-left text-sm"
                        data-sort-value="difficulty-desc"
                        role="option"
                      >
                        По сложности
                      </button>
                    </div>
                  </div>

                  <p
                    class="m-0 text-sm font-medium md:text-right"
                    style="color: var(--text-muted)"
                    data-projects-count
                    aria-live="polite"
                  ></p>
                </div>
              </div>
            </div>
          </div>

          <div
            class="mb-6 hidden flex flex-col items-center justify-center rounded-2xl border px-6 py-14 text-center"
            style="
              background: var(--surface);
              border-color: var(--border);
              box-shadow: var(--shadow-soft);
            "
            data-projects-empty
            hidden
          >
            <i
              class="fas fa-search mb-4 text-2xl"
              style="color: var(--accent)"
              aria-hidden="true"
            ></i>
            <p
              class="mb-2 text-xl font-semibold"
              style="font-family: var(--font-display); color: var(--text)"
            >
              Ничего не найдено
            </p>
            <p
              class="m-0 max-w-md text-sm"
              style="color: var(--text-muted)"
            >
              Попробуйте изменить запрос или сбросить фильтры
            </p>
          </div>

          <div
            class="grid xs:grid-cols-1 sm:grid-cols-2 md:grid-cols-2 gap-6 text-center projects"
            data-projects-grid
            role="list"
          ></div>
          <!-- /.grid -->
        </section>
      </main>
      <!-- /.main -->
      <footer class="site-footer mt-10 mt-auto text-center">
        <div class="site-footer__text py-5 px-4 text-sm">
          andTheowind · портфолио
        </div>
      </footer>
      <!-- /.footer -->
    </div>

    <nav aria-label="Основная навигация">
      <ul class="main-menu">
        <li class="flex items-center my-7">
          <i class="fas fa-home" aria-hidden="true"></i>
          <a href="index.html" class="ml-2">Главная</a>
        </li>
        <li class="flex items-center my-7 ml-4">
          <i class="fas fa-folder" aria-hidden="true"></i>
          <a href="projects.html" class="ml-2">Проекты</a>
        </li>
        <li class="flex items-center my-7 ml-8">
          <i class="fas fa-envelope" aria-hidden="true"></i>
          <a href="contacts.html" class="ml-2">Контакты</a>
        </li>
      </ul>
    </nav>
    <!-- /.nav -->

    <script src="js/theme.js"></script>
    <script src="js/script.js"></script>
    <script src="js/projects-data.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/projects-effects.js"></script>
    <script src="js/preloader.js"></script>
  </body>
</html>
