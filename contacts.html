<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Контакты веб-разработчика andTheowind." />
    <title>Контакты — andTheowind</title>
    <link rel="stylesheet" href="css/tailwindmin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
    />
  </head>
  <body class="flex justify-center items-center">
    <div class="mask flex justify-center items-center">
      <div class="loader" role="status" aria-label="Загрузка"></div>
    </div>
    <div
      class="wrapper page-projects contacts-page-wrapper flex flex-col justify-center"
    >
      <header>
        <div class="container">
          <div class="circle-container">
            <div class="circle">
              <button
                type="button"
                class="border-none"
                id="closeBtn"
                aria-label="Закрыть меню"
              >
                <i class="fas fa-times" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="border-none"
                id="openBtn"
                aria-label="Открыть меню"
              >
                <i class="fas fa-bars" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>
      </header>
      <main>
        <section
          class="contacts-page contacts-section container mx-auto px-4 sm:px-6 md:px-8 lg:px-12"
          aria-labelledby="contacts-title"
        >
          <header class="title text-center mt-14 mb-12 md:mt-16 md:mb-16">
            <h1
              id="contacts-title"
              class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl"
            >
              Мои <span>контакты</span>
            </h1>
            <p class="subtitle">
              Свяжитесь удобным способом — отвечу в рабочее время.
            </p>
          </header>
          <div
            class="boxes grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-w-5xl mx-auto"
          >
            <div class="my-2.5 md:mx-0">
              <span>Email</span>
              <a href="mailto:and.theowind@gmail.com">and.theowind@gmail.com</a>
            </div>
            <div class="my-2.5 md:mx-0">
              <span>Телефон</span>
              <a href="tel:+79398854462">+7 (939) 885-44-62</a>
            </div>
            <div class="my-2.5 md:mx-0">
              <span>Telegram</span>
              <a
                href="https://t.me/andtheowind"
                target="_blank"
                rel="noopener noreferrer"
                >@andtheowind</a
              >
            </div>
          </div>
        </section>
      </main>
      <footer
        class="mt-10 mt-auto border-t border-white border-opacity-10 bg-gray-900 bg-opacity-70 text-center"
      >
        <div class="py-5 px-4 text-sm text-gray-400">
          andTheowind · портфолио
        </div>
      </footer>
    </div>
    <nav aria-label="Основная навигация">
      <ul class="main-menu">
        <li class="flex items-center my-7">
          <i class="fas fa-home" aria-hidden="true"></i
          ><a href="index.html" class="ml-2">Главная</a>
        </li>
        <li class="flex items-center my-7 ml-4">
          <i class="fas fa-folder" aria-hidden="true"></i
          ><a href="projects.html" class="ml-2">Проекты</a>
        </li>
        <li class="flex items-center my-7 ml-8">
          <i class="fas fa-envelope" aria-hidden="true"></i
          ><a href="contacts.html" class="ml-2">Контакты</a>
        </li>
      </ul>
    </nav>
    <script src="js/script.js"></script>
    <script src="js/preloader.js"></script>
  </body>
</html>
